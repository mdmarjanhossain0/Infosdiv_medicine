{% load static %}

<nav aria-label="Page navigation example">
	<ul class="pagination justify-content-end">
		{% if medicines.has_previous %}
		<li class=" page-item">
			<a class="page-link"
				href="/?{% if query %}query={{query}}&{% endif %}page={{ medicines.previous_page_number }}">Previous</a>
		</li>
		{% endif %}
		{% for i in medicines.paginator.get_elided_page_range %}
		{% if medicines.number == i %}
		<li class="page-item">
			<a class="page-link nav-background" href="">{{ i }}</a>
		</li>
		{% else %}
		<li class="page-item">
			<a class="page-link" href="/?{% if query %}query={{query}}&{% endif %}page={{ i }}">{{ i }}</a>
		</li>
		{% endif %}
		{% endfor %}
		{% if medicines.has_next %}
		<li class=" page-item">
			<a class="page-link"
				href="/?{% if query %}query={{query}}&{% endif %}page={{ medicines.next_page_number }}">Next</a>
		</li>
		{% endif %}
	</ul>
</nav>
